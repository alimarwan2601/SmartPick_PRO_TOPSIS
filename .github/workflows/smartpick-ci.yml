
name: SmartPick CI Pipeline

on:
  push:
    branches:
      - main
      - ci-cd-practice
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Check SmartPick Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Required Files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files exist!"

      - name: Check JavaScript Syntax
        run: node --check script.js

      - name: CI Success
        run: echo "SmartPick CI Pipeline completed successfully!"
